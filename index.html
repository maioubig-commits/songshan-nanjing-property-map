const map = L.map('map', { zoomControl: true }).setView([25.052, 121.565], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function makeIcon(item){
  const color = item.key ? '#b6842c' : '#3f6b5c';
  const ring = item.approx==='district' ? '#a4462f' : color;
  const keyBadge = item.key ? `<div style="
        position:absolute;top:-6px;right:-7px;width:16px;height:16px;border-radius:50%;
        background:#fff;border:1px solid #b6842c;display:flex;align-items:center;justify-content:center;
        font-size:9px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.3);z-index:5;">🔑</div>` : '';
  return L.divIcon({
    className: '',
    html: `<div style="position:relative;width:28px;height:28px;">
      <div style="width:28px;height:28px;border-radius:50% 50% 50% 0;background:${color};
        border:2px solid ${ring};transform:rotate(-45deg);box-shadow:0 2px 4px rgba(0,0,0,.35);
        display:flex;align-items:center;justify-content:center;">
      <span style="transform:rotate(45deg);color:#fff;font-size:9px;font-weight:700;font-family:'Noto Sans TC',sans-serif;">${item.n}</span>
      </div>${keyBadge}
    </div>`,
    iconSize:[28,28], iconAnchor:[14,28], popupAnchor:[0,-26]
  });
}

// 同一棟／同一座標的案件，把釘子平均散在小圈上，避免互相蓋住
const spread = {};
DATA.forEach(item => {
  const k = item.lat.toFixed(6) + ',' + item.lon.toFixed(6);
  (spread[k] = spread[k] || []).push(item);
});
Object.values(spread).forEach(group => {
  group.forEach((item, idx) => {
    item.sameSpot = group.length - 1;
    if (group.length === 1) { item.mlat = item.lat; item.mlon = item.lon; return; }
    const R = 11 + 3 * group.length;                      // 公尺
    const th = (2 * Math.PI * idx) / group.length - Math.PI / 2;
    item.mlat = item.lat + (R * Math.sin(th)) / 111320;
    item.mlon = item.lon + (R * Math.cos(th)) / (111320 * Math.cos(item.lat * Math.PI / 180));
  });
});

const markers = {};
const bounds = [];
DATA.forEach(item => {
  const marker = L.marker([item.mlat, item.mlon], { icon: makeIcon(item) }).addTo(map);
  let html = `<div class="popup-name">${item.name}</div>`;
  html += `<div class="popup-addr">${item.addr}</div>`;
  html += `<div class="popup-row"><strong>總價 ${item.price.toLocaleString()} 萬</strong>`;
  html += item.ping ? ` ｜ ${item.ping} 坪` : '';
  html += item.layout ? ` ｜ ${item.layout}` : '';
  html += `</div>`;
  html += `<div class="popup-row">${item.cat}${item.age?' ｜ 屋齡 '+item.age+' 年':''}${item.face?' ｜ 座向 '+item.face:''}</div>`;
  html += `<div class="popup-row">承辦 ${item.agent||'未指定'}</div>`;
  if(item.key){ html += `<div class="popup-row" style="color:#8a5a12;font-weight:700;">🔑 店內有鑰匙，可即時帶看</div>`; }
  else if(item.view){ html += `<div class="popup-row">看屋方式：${item.view}</div>`; }
  if(item.use){ html += `<div class="popup-detail">${item.use}</div>`; }
  if(item.approx==='twhg'){ html += `<div class="popup-row" style="color:#6a6f63;">座標取自台灣房屋官網物件資料</div>`; }
  else if(item.approx){ html += `<div class="popup-row" style="color:#a4462f;">⚠ 座標為${item.approx==='district'?'行政區':'路段'}概略位置，非精確門牌</div>`; }
  if(item.sameSpot){ html += `<div class="popup-row" style="color:#6a6f63;">同一棟另有 ${item.sameSpot} 件，釘子已略微錯開</div>`; }
  html += '<div class="popup-btns">';
  html += `<a class="popup-link" href="case/${item.slug}.html">查看詳情 →</a>`;
  if(item.link){ html += `<a class="popup-link ghost" href="${item.link}" target="_blank" rel="noopener">官網物件頁 ↗</a>`; }
  html += '</div>';
  marker.bindPopup(html, { maxWidth: 300 });
  markers[item.i] = marker;
  bounds.push([item.mlat, item.mlon]);
});
const HOME=[[24.98,121.50],[25.10,121.63]];
let userMoved=false;
function fitAll(force){
  map.invalidateSize();
  if(force || !userMoved) map.fitBounds(HOME, { padding:[20,20], animate:false });
}
fitAll(true);
requestAnimationFrame(()=>requestAnimationFrame(()=>fitAll(true)));
window.addEventListener('load', ()=>setTimeout(()=>{
  fitAll(true);
  map.on('zoomstart dragstart', ()=>{ userMoved=true; });
},80));
new ResizeObserver(()=>{ map.invalidateSize(); if(!userMoved) map.fitBounds(HOME,{padding:[20,20],animate:false}); })
  .observe(document.getElementById('map'));

let activeFilter='all', searchTerm='', catFilter='all', agentFilter='all', priceRange='all';

const cats={}, agents={};
DATA.forEach(d=>{ cats[d.cat]=(cats[d.cat]||0)+1; new Set(d.ags).forEach(a=>agents[a]=(agents[a]||0)+1); });
document.getElementById('catSel').innerHTML += Object.entries(cats)
  .map(([c,n])=>`<option value="${c}">${c}（${n}）</option>`).join('');
document.getElementById('agentSel').innerHTML += Object.entries(agents).sort((a,b)=>b[1]-a[1])
  .map(([a,n])=>`<option value="${a}">${a}（${n}）</option>`).join('');

function passesFilter(item){
  if(activeFilter==='key' && !item.key) return false;
  if(catFilter!=='all' && item.cat!==catFilter) return false;
  if(agentFilter!=='all' && !item.ags.includes(agentFilter)) return false;
  if(priceRange!=='all'){
    const [lo,hi]=priceRange.split('-');
    if(lo && item.price<Number(lo)) return false;
    if(hi && item.price>=Number(hi)) return false;
  }
  if(searchTerm){
    const hay=(item.name+' '+item.addr+' '+item.cat+' '+item.agent+' '+item.use+' '+item.layout+(item.key?' 有鑰匙 key 鑰匙':'')).toLowerCase();
    if(!hay.includes(searchTerm)) return false;
  }
  return true;
}

function renderList(){
  const list=document.getElementById('list');
  const filtered=DATA.filter(passesFilter);
  document.getElementById('countBadge').textContent =
    `共 ${DATA.length} 件・🔑 ${DATA.filter(d=>d.key).length} 件有KEY・顯示 ${filtered.length} 件`;
  DATA.forEach(item=>{
    const m=markers[item.i]; if(!m) return;
    if(passesFilter(item)){ if(!map.hasLayer(m)) m.addTo(map); }
    else if(map.hasLayer(m)) map.removeLayer(m);
  });
  if(!filtered.length){ list.innerHTML='<div class="empty-state">沒有符合條件的案件</div>'; return; }
  list.innerHTML = filtered.map(item=>{
    let tags='';
    if(item.key) tags+='<span class="tag key">🔑 有KEY</span>';
    tags+=`<span class="tag cat">${item.cat}</span>`;
    return `<div class="item" data-i="${item.i}">
      <div class="item-top">
        <div class="item-name"><span class="num">#${item.n}</span>${item.name}</div>
        <div class="item-price">${item.price.toLocaleString()}萬</div>
      </div>
      <div class="item-addr">${item.addr}</div>
      <div class="item-meta">${[item.ping?item.ping+'坪':'',item.layout,item.age?'屋齡'+item.age:'',item.agent?'承辦 '+item.agent:''].filter(Boolean).join(' ｜ ')}</div>
      <div class="item-tags">${tags}<a class="item-link" href="case/${item.slug}.html">詳情 ↗</a></div>
    </div>`;
  }).join('');
  list.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click',ev=>{
      if(ev.target.closest('.item-link')) return;
      const i=Number(el.dataset.i); const m=markers[i]; if(!m) return;
      map.setView(m.getLatLng(), Math.max(map.getZoom(),16), {animate:false});
      m.openPopup();
      list.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
    });
  });
}

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter=chip.dataset.filter;
    renderList();
  });
});
document.getElementById('searchInput').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase(); renderList();});
document.getElementById('catSel').addEventListener('change',e=>{catFilter=e.target.value; renderList();});
document.getElementById('agentSel').addEventListener('change',e=>{agentFilter=e.target.value; renderList();});
document.getElementById('priceSel').addEventListener('change',e=>{priceRange=e.target.value; renderList();});
renderList();
</script>
